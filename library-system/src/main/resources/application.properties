# Databasinställningar
spring.datasource.url=jdbc:sqlite:library.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Använd korrekt SQLite-dialect istället för H2
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# VIKTIGT: Använd 'none' för att bevara befintlig databas
spring.jpa.hibernate.ddl-auto=none

# Förhindra att JPA försöker skapa schema
spring.jpa.generate-ddl=false

# SQLite-specifika inställningar
spring.jpa.properties.hibernate.dialect.metadata.use_sequences=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false   
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# Debugging (kan tas bort senare)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

implementation 'org.springframework.boot:spring-boot-starter-security'
spring.security.user.name=oscar123
spring.security.user.password=oscar321

server.servlet.session.timeout=1m

#Förhindrar xss attacker
server.servlet.session.cookie.http-only=true 

#ska vara true vid deployment
server.servlet.session.cookie.secure=false

#aktivera csrf skydd
server.servlet.session.cookie.same-site=lax

o.s.s.authentication.UsernamePasswordAuthenticationFilter : Authentication request failed
logging.level.org.springframework.security=DEBUG
o.s.s.authentication.ProviderManager                  : Authentication success

