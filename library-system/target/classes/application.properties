# Databasinstallningar
spring.datasource.url=jdbc:sqlite:library.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Anvand korrekt SQLite-dialect istallet for H2
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# VIKTIGT: Anvand none for att bevara befintlig databas
spring.jpa.hibernate.ddl-auto=none

# Forhindra att JPA forsoker skapa schema
spring.jpa.generate-ddl=false

# SQLite-specifika installningar
spring.jpa.properties.hibernate.dialect.metadata.use_sequences=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false   
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# Logging & Debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.security=DEBUG

server.servlet.session.timeout=1m
server.servlet.session.cookie.http-only=true 
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
